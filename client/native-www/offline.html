<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Connect to LabRec Server</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media screen and (min-width: 2400px) and (min-height: 1200px) {
      html {
        font-size: 22px;
      }
    }
    @media screen and (min-width: 3200px) and (min-height: 1700px) {
      html {
        font-size: 26px;
      }
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f1f5f9;
      color: #0f172a;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    main {
      width: 100%;
      max-width: 32rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 1rem;
      padding: 1.75rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.375rem;
      line-height: 1.3;
    }
    .subtitle {
      margin: 0 0 1.5rem;
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      margin-block-end: 1.25rem;
    }
    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1e293b;
    }
    .hint {
      font-size: 0.85rem;
      color: #475569;
    }
    input[type="url"] {
      width: 100%;
      font: inherit;
      font-size: max(1rem, 1em);
      min-height: 48px;
      padding: 0.75rem 0.875rem;
      border: 2px solid #64748b;
      border-radius: 0.625rem;
      background: #ffffff;
      color: #0f172a;
    }
    input[type="url"]:user-invalid {
      border-color: #b91c1c;
    }
    input[type="url"]:focus-visible,
    button:focus-visible {
      outline: 3px solid #0b57d0;
      outline-offset: 2px;
    }
    fieldset {
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      padding: 0.875rem 1rem 1rem;
      margin: 0 0 1.25rem;
    }
    legend {
      padding: 0 0.375rem;
      font-weight: 600;
      font-size: 0.875rem;
      color: #334155;
    }
    .radio-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .radio-item {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      min-height: 44px;
    }
    .radio-item input[type="radio"] {
      width: 1.25rem;
      height: 1.25rem;
      accent-color: #2563eb;
      margin: 0;
    }
    .radio-item label {
      font-weight: 500;
      cursor: pointer;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    button {
      font: inherit;
      font-weight: 600;
      min-height: 48px;
      padding: 0.75rem 1.25rem;
      border-radius: 0.625rem;
      border: 1px solid transparent;
      cursor: pointer;
    }
    button[type="submit"] {
      flex: 1 1 12rem;
      background: #2563eb;
      color: #ffffff;
    }
    button[type="button"] {
      flex: 0 1 auto;
      background: #e2e8f0;
      color: #0f172a;
      border-color: #94a3b8;
    }
    .status {
      margin-top: 1rem;
      min-height: 1.375rem;
      font-size: 0.9rem;
      color: #334155;
    }
    .status.error {
      color: #b91c1c;
      font-weight: 600;
    }
    @media (pointer: coarse) {
      input[type="url"],
      button {
        min-height: 52px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="connect-heading">Server Connection Unavailable</h1>
    <p class="subtitle">
      The whiteboard could not reach the LabRec server on your network. Verify both devices share the same Wi-Fi and the server is running on port 3000.
    </p>

    <form id="server-form" aria-labelledby="connect-heading" novalidate>
      <div class="form-group">
        <label for="server-url">Server URL <span aria-hidden="true">*</span></label>
        <input
          type="url"
          id="server-url"
          name="server_url"
          value="https://ulrms-c.onrender.com"
          autocomplete="url"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          enterkeyhint="go"
          aria-describedby="server-url-help server-status"
          required
        />
        <span id="server-url-help" class="hint">Include https:// (default: https://ulrms-c.onrender.com, or LAN https://192.168.1.220:3000).</span>
      </div>

      <fieldset>
        <legend>Destination Screen</legend>
        <div class="radio-list">
          <div class="radio-item">
            <input type="radio" id="dest-home" name="destination" value="" checked />
            <label for="dest-home">App Home / Login</label>
          </div>
          <div class="radio-item">
            <input type="radio" id="dest-board" name="destination" value="/whiteboard" />
            <label for="dest-board">Direct to Whiteboard</label>
          </div>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" id="connect-btn">Connect Now</button>
        <button type="button" id="preset-render-btn">Reset to Render Default</button>
        <button type="button" id="preset-lan-btn">Use Local LAN (192.168.1.220)</button>
      </div>

      <p id="server-status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    (function () {
      var RENDER_URL = 'https://ulrms-c.onrender.com';
      var LAN_URL = 'https://192.168.1.220:3000';
      var form = document.getElementById('server-form');
      var urlInput = document.getElementById('server-url');
      var statusEl = document.getElementById('server-status');
      var connectBtn = document.getElementById('connect-btn');
      var renderBtn = document.getElementById('preset-render-btn');
      var lanBtn = document.getElementById('preset-lan-btn');

      try {
        var saved = localStorage.getItem('labrec_server_url');
        if (saved && /^https?:\/\//i.test(saved)) {
          urlInput.value = saved;
        }
      } catch (_) {}

      function validateUrl() {
        var val = urlInput.value.trim().replace(/\/+$/, '');
        if (!val || !/^https?:\/\/[^/\s]+/i.test(val)) {
          urlInput.setCustomValidity('Enter a full http:// or https:// server address.');
          urlInput.setAttribute('aria-invalid', 'true');
          return null;
        }
        urlInput.setCustomValidity('');
        urlInput.removeAttribute('aria-invalid');
        return val;
      }

      urlInput.addEventListener('input', function () {
        urlInput.setCustomValidity('');
        urlInput.removeAttribute('aria-invalid');
        statusEl.textContent = '';
        statusEl.className = 'status';
      });

      urlInput.addEventListener('blur', function () {
        if (urlInput.value.trim()) {
          validateUrl();
        }
      });

      renderBtn.addEventListener('click', function () {
        urlInput.value = RENDER_URL;
        urlInput.setCustomValidity('');
        urlInput.removeAttribute('aria-invalid');
        statusEl.textContent = 'Reset URL to Render default (' + RENDER_URL + ').';
        statusEl.className = 'status';
      });

      lanBtn.addEventListener('click', function () {
        urlInput.value = LAN_URL;
        urlInput.setCustomValidity('');
        urlInput.removeAttribute('aria-invalid');
        statusEl.textContent = 'Switched URL to LAN server (' + LAN_URL + ').';
        statusEl.className = 'status';
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var clean = validateUrl();
        if (!clean) {
          statusEl.textContent = urlInput.validationMessage;
          statusEl.className = 'status error';
          urlInput.focus();
          return;
        }

        var selectedDest = '';
        var checkedRadio = form.querySelector('input[name="destination"]:checked');
        if (checkedRadio) selectedDest = checkedRadio.value;
        var target = clean + selectedDest;

        try {
          localStorage.setItem('labrec_server_url', clean);
        } catch (_) {}

        connectBtn.disabled = true;
        statusEl.textContent = 'Checking ' + target + '...';
        statusEl.className = 'status';

        window.location.href = target;
      });
    })();
  </script>
</body>
</html>
